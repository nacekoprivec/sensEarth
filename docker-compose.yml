services:

  # Core sensearth Database Service
  core-db:
    container_name: sensearth-core-db
    image: timescale/timescaledb-ha:pg14-latest
    user: root
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sensearth_db
      PGDATA: /home/postgres/pgdata/data
    ports:
      - "5433:5432"
    volumes:
      - ./docker_data/postgres_sensearth:/home/postgres/pgdata/data
      - ./init_db/sensearth.dump:/docker-entrypoint-initdb.d/sensearth.dump
      - ./init_db/restore-sensearth.sh:/docker-entrypoint-initdb.d/restore.sh
    restart: always


  # Monitoring Database Service
  monitoring-db:
    container_name: sensearth-monitoring-db
    image: timescale/timescaledb-ha:pg14-latest
    user: root
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monitoring_db
      PGDATA: /home/postgres/pgdata/data
    ports:
      - "5434:5432"
    volumes:
      - ./docker_data/postgres_watchdog:/home/postgres/pgdata/data
      - ./init_db/monitoring.dump:/docker-entrypoint-initdb.d/monitoring.dump
      - ./init_db/restore-monitoring.sh:/docker-entrypoint-initdb.d/restore.sh
    restart: always


  # Middleware API Service
  middleware-api:
    container_name: sensearth-middleware-api
    build:
      context: ./anomaly-detection
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "5006:5006"
    depends_on:
      - core-db
      - monitoring-api
    environment:
      CORE_DB_URL: ${CORE_DB_URL}
      MONITORING_API_URL: ${MONITORING_API}
    restart: always

  # Monitoring API Service
  monitoring-api:
    container_name: sensearth-monitoring-api
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "8001:8001"
    depends_on:
      - monitoring-db
    environment:
      MONITORING_DB_URL: ${MONITORING_DB_URL}
    restart: always

  # Scraper
  scraper:
    container_name: sensearth-scraper
    build:
      context: ./web_scraper
      dockerfile: Dockerfile
    depends_on:
      - middleware-api
      - minio
    environment:
      API_URL: ${MIDDLEWARE_API}
      MONITORING_API_URL: ${MONITORING_API}
    volumes:
      - scraper_state:/app/state
    command: python scraper.py --config


  # pgAdmin
  pgadmin:
    container_name: sensearth-pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8082:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - core-db 
    restart: always


  # MinIO
  minio:
    container_name: sensearth-minio
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./docker_data/minio_data:/data


  # Frontend
  frontend:
    container_name: sensearth-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5005:80"
    depends_on:
      - middleware-api
    environment:
      VITE_MIDDLEWARE_API_URL: ${VITE_MIDDLEWARE_API_URL}
      VITE_MONITORING_API_URL: ${VITE_MONITORING_API_URL}
    restart: always


volumes:
  scraper_state:
